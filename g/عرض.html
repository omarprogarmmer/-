<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>عرض الملف</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      padding: 2rem;
      background-color: #f9f9f9;
      direction: rtl;
      text-align: center;
    }
    h2 {
      color: #2a9d8f;
      margin-bottom: 2rem;
    }
    img {
      max-width: 90%;
      border-radius: 15px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }
    pre {
      background: #e0f7fa;
      padding: 1rem;
      border-radius: 10px;
      white-space: pre-wrap;
      text-align: right;
      font-size: 1rem;
      line-height: 1.8;
      max-width: 800px;
      margin: 0 auto;
    }
    #preview-content {
      margin-top: 1rem;
    }
    /* زر الرجوع العائم */
    #floating-back-btn {
      position: fixed;
      top: 20px;
      left: 20px; /* غيّر إلى right: 20px; إذا تفضل الزر على اليمين */
      z-index: 999;
      background-color: #457b9d;
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    #floating-back-btn:hover {
      background-color: #2a9d8f;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <!-- زر الرجوع -->
  <button onclick="goBack()" id="floating-back-btn" title="الرجوع للصفحة السابقة">⬅</button>

  <h2>📄 عرض الملف</h2>

  <div id="preview-content">جاري التحميل...</div>

  <script>
    function goBack() {
      if (document.referrer) {
        window.history.back();
      } else {
        window.location.href = "../index.html";


      }
    }

    const previewDiv = document.getElementById('preview-content');
    const data = localStorage.getItem('preview_file');

    if (data) {
      const file = JSON.parse(data);
      previewDiv.innerHTML = '';
      if (file.type.startsWith('image/')) {
        const img = document.createElement('img');
        img.src = file.data;
        previewDiv.appendChild(img);
      } else {
        const pre = document.createElement('pre');
        pre.textContent = file.data;
        previewDiv.appendChild(pre);
      }
    } else {
      previewDiv.textContent = '⚠️ لم يتم العثور على أي ملف.';
    }
  </script>
</body>
</html>
