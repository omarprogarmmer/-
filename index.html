<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الأقسام - المكتبة</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      padding: 1.5rem 1rem;
      background-color: #f0f4f8;
      max-width: 600px;
      margin: auto;
      box-sizing: border-box;
      text-align: center;
    }
    h1 {
      color: #2a9d8f;
      font-size: 2rem;
      margin-bottom: 1.8rem;
      word-break: break-word;
    }
    #addSectionBtn {
      background-color: #2a9d8f;
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.2rem;
      width: 90%;
      max-width: 320px;
      margin-bottom: 25px;
      transition: background-color 0.3s ease;
    }
    #addSectionBtn:hover {
      background-color: #1d5e6b;
    }
    #sectionsList {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 40px;
    }
    .section-item {
      background-color: #fff;
      padding: 16px 20px;
      border-radius: 14px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: box-shadow 0.3s ease;
      user-select: none;
    }
    .section-item:hover {
      box-shadow: 0 6px 18px rgba(0,0,0,0.22);
    }
    .section-name {
      font-size: 1.2rem;
      color: #264653;
      flex-grow: 1;
      word-break: break-word;
      text-align: right;
      padding-right: 12px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .btn-edit, .btn-delete {
      background-color: #2a9d8f;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
      user-select: none;
      flex-shrink: 0;
    }
    .btn-delete {
      background-color: #e76f51;
    }
    .btn-edit:hover {
      background-color: #1b5f73;
    }
    .btn-delete:hover {
      background-color: #b54334;
    }
    @media (max-width: 400px) {
      #addSectionBtn {
        width: 100%;
        max-width: none;
        padding: 12px 20px;
        font-size: 1.1rem;
      }
      .section-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .btn-group {
        width: 100%;
        justify-content: flex-start;
      }
      .btn-edit, .btn-delete {
        width: 48%;
        font-size: 1.1rem;
        padding: 10px 0;
      }
      .section-name {
        padding-right: 0;
        text-align: right;
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <h1>📚 مكتبة الدروس</h1>

  <button id="addSectionBtn">➕ إضافة قسم جديد</button>

  <div id="sectionsList">
    <!-- تظهر الأقسام هنا -->
  </div>

  <script>
    const sectionsList = document.getElementById('sectionsList');
    const addSectionBtn = document.getElementById('addSectionBtn');

    let sections = JSON.parse(localStorage.getItem('sections') || '[]');

    function saveSections() {
      localStorage.setItem('sections', JSON.stringify(sections));
    }

    function renderSections() {
      sectionsList.innerHTML = '';

      if (sections.length === 0) {
        sectionsList.innerHTML = '<p style="color:#666; font-size:1.1rem;">لا توجد أقسام مضافة بعد.</p>';
        return;
      }

      sections.forEach((section, index) => {
        const item = document.createElement('div');
        item.className = 'section-item';

        // عند الضغط على اسم القسم ننتقل إلى صفحة القسم مع حفظ الاسم
        const nameSpan = document.createElement('span');
        nameSpan.className = 'section-name';
        nameSpan.textContent = section;
        nameSpan.onclick = () => {
          localStorage.setItem('currentSection', section);
          window.location.href = 'section.html';
        };

        // أزرار تعديل وحذف
        const btnGroup = document.createElement('div');
        btnGroup.className = 'btn-group';

        const editBtn = document.createElement('button');
        editBtn.className = 'btn-edit';
        editBtn.textContent = '✏️ تعديل الاسم';
        editBtn.title = 'تعديل اسم القسم';
        editBtn.onclick = (e) => {
          e.stopPropagation();
          const newName = prompt('ادخل اسم القسم الجديد:', section);
          if (newName !== null) {
            const trimmed = newName.trim();
            if (trimmed === '') {
              alert('الاسم لا يمكن أن يكون فارغاً!');
              return;
            }
            if (sections.includes(trimmed)) {
              alert('هذا الاسم موجود مسبقاً!');
              return;
            }
            sections[index] = trimmed;
            saveSections();
            renderSections();
          }
        };

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete';
        delBtn.textContent = '🗑️ حذف القسم';
        delBtn.title = 'حذف القسم';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          if (confirm(`هل تريد حذف القسم "${section}"؟\n(سوف تحذف جميع الملفات المرتبطة به أيضاً)`)) {
            sections.splice(index, 1);
            saveSections();
            // حذف ملفات القسم من localStorage
            localStorage.removeItem(`files_${section}`);
            renderSections();
          }
        };

        btnGroup.appendChild(editBtn);
        btnGroup.appendChild(delBtn);

        item.appendChild(nameSpan);
        item.appendChild(btnGroup);

        sectionsList.appendChild(item);
      });
    }

    addSectionBtn.onclick = () => {
      let newSection = prompt('ادخل اسم القسم الجديد:');
      if (newSection !== null) {
        newSection = newSection.trim();
        if (newSection === '') {
          alert('الاسم لا يمكن أن يكون فارغاً!');
          return;
        }
        if (sections.includes(newSection)) {
          alert('هذا الاسم موجود مسبقاً!');
          return;
        }
        sections.push(newSection);
        saveSections();
        renderSections();
      }
    };

    renderSections();
  </script>

</body>
</html>
