<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>صفحة الدروس</title>
<style>
  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f2f2f2;
    padding: 1rem;
    direction: rtl;
    color: #1d3557;
  }
  h2 {
    text-align: center;
    margin-bottom: 1.5rem;
  }
  #buttons-container {
    margin-bottom: 1rem;
  }
  .section-button {
    display: block;
    width: 100%;
    background-color: #457b9d;
    color: white;
    padding: 1rem 1.5rem;
    margin: 0.5rem 0;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    cursor: pointer;
    text-align: center;
    transition: background-color 0.3s ease;
  }
  .section-button:hover {
    background-color: #1d3557;
  }
  #add-section-btn {
    background-color: #2a9d8f;
    padding: 1rem 1.5rem;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-size: 1.1rem;
    width: 100%;
    transition: background-color 0.3s ease;
  }
  #add-section-btn:hover {
    background-color: #1f776b;
  }
  #section-content {
    display: none;
    margin-top: 1rem;
    padding: 1rem;
    border: 1px solid #457b9d;
    border-radius: 10px;
    background-color: #e0f7fa;
    min-height: 200px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  #back-button {
    display: none;
    margin-bottom: 1rem;
    background-color: #1d3557;
    color: white;
    border: none;
    padding: 0.7rem 1.2rem;
    border-radius: 8px;
    cursor: pointer;
  }
  #back-button:hover {
    background-color: #457b9d;
  }
</style>
</head>
<body>

<h2>📚 أقسام الدروس</h2>

<div id="buttons-container">
  <button class="section-button" data-file="arabic.html">العربي</button>
  <button class="section-button" data-file="english.html">الإنكليزي</button>
  <button class="section-button" data-file="math.html">الرياضيات</button>
</div>

<button id="add-section-btn">+ إضافة قسم جديد</button>

<button id="back-button">⬅ العودة للأقسام</button>

<div id="section-content">
  <p>اختر قسم لعرض محتواه هنا.</p>
</div>

<script>
  const buttonsContainer = document.getElementById('buttons-container');
  const buttons = document.querySelectorAll('.section-button');
  const contentDiv = document.getElementById('section-content');
  const backButton = document.getElementById('back-button');
  const addSectionBtn = document.getElementById('add-section-btn');

  function attachButtonListeners() {
    const currentButtons = document.querySelectorAll('.section-button');
    currentButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const file = btn.getAttribute('data-file');
        if (!file) return alert('هذا القسم لا يحتوي على محتوى.');
        fetch(file)
          .then(response => {
            if (!response.ok) throw new Error('خطأ في تحميل المحتوى');
            return response.text();
          })
          .then(html => {
            contentDiv.innerHTML = html;
            contentDiv.style.display = 'block';
            buttonsContainer.style.display = 'none';
            addSectionBtn.style.display = 'none';
            backButton.style.display = 'inline-block';
          })
          .catch(err => {
            contentDiv.innerHTML = `<p>لم نستطع تحميل المحتوى. حاول لاحقاً.</p>`;
            console.error(err);
          });
      });
    });
  }

  attachButtonListeners();

  backButton.addEventListener('click', () => {
    contentDiv.style.display = 'none';
    buttonsContainer.style.display = 'block';
    addSectionBtn.style.display = 'inline-block';
    backButton.style.display = 'none';
    contentDiv.innerHTML = '<p>اختر قسم لعرض محتواه هنا.</p>';
  });

  addSectionBtn.addEventListener('click', () => {
    const newSectionName = prompt("اكتب اسم القسم الجديد:");
    if (newSectionName && newSectionName.trim() !== '') {
      // إنشاء زر جديد
      const newBtn = document.createElement('button');
      newBtn.className = 'section-button';
      newBtn.textContent = newSectionName.trim();

      // لا يوجد ملف محتوى لهذا القسم، لذا نخلي data-file فارغ
      newBtn.setAttribute('data-file', '');

      buttonsContainer.appendChild(newBtn);

      // نعيد ربط الأحداث للزر الجديد
      attachButtonListeners();

      alert(`تم إضافة القسم "${newSectionName.trim()}"، لكن لا يوجد محتوى مرتبط بعد.`);
    } else {
      alert('لم يتم إدخال اسم صالح للقسم.');
    }
  });
</script>

</body>
</html>
